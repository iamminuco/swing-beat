<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스윙 박자 · v2</title><link rel="stylesheet" href="./ui/style.css"></head>
<body><main>
<label for="fileInput">곡 열기 · 오디오 파일</label><input id="fileInput" type="file" accept="audio/*" aria-describedby="startup" disabled>
<p id="startup" role="status">곡 열기를 준비 중이에요. 계속 비활성 상태라면 연결을 확인하고 새로고침해 주세요. JavaScript를 켜야 사용할 수 있어요.</p>
<div id="progress" role="status" aria-live="polite"></div><p id="error" role="alert"></p><p id="notice" role="status"></p>
<h1 id="songTitle">곡을 골라 주세요</h1><p id="songSub">오디오 파일 · 30초 이상</p>
<section id="songView" hidden>
<p id="saveStatus" role="status"></p><p id="uncertainty"></p><p id="correctionNotice"></p><p id="restartNotice"></p>
<output id="currentBeat" aria-label="현재 박">·</output><div id="timeline" role="region" aria-label="큰 박자 타임라인" tabindex="0"></div>
<div class="controls"><button id="playBtn" type="button">재생</button><label>배속 <select id="rate"><option value="0.5">0.5배</option><option value="0.75">0.75배</option><option value="1" selected>1.0배</option><option value="1.25">1.25배</option></select></label></div>
<label for="seek">곡 위치</label><input id="seek" type="range" min="0" max="0" step="0.01" value="0">
<div class="controls"><label><input id="clickOn" type="checkbox" checked> 카운트음</label><label>강조 <select id="accent"><option value="EVEN">짝수 박</option><option value="ONE_FIVE">1과 5</option><option value="OFF">균일하게</option></select></label></div>
<div class="controls"><button id="setOneBtn" type="button">내 1 맞추기</button><button id="swapBtn" type="button">1↔5 바꾸기</button><label><input id="correctionOn" type="checkbox" checked> 내 보정 켜기</label></div>
<div class="controls"><button id="tapPracticeBtn" type="button">연습 · 모든 박 탭</button><button id="listenPracticeBtn" type="button">연습 · 청음 1개</button></div>
<section id="practice" hidden><h2 id="practiceTitle"></h2><p id="practiceHint"></p><button id="tapPad" type="button">박마다 탭</button><button id="hearBtn" type="button">들어 보기</button><div class="controls"><button id="answerYes" type="button">붙어 있어요</button><button id="answerNo" type="button">어긋나요</button></div><p id="practiceResult" role="status"></p><button id="leavePracticeBtn" type="button">곡 화면으로</button></section>
</section><audio id="audio" preload="metadata" playsinline></audio>
</main><script type="module" src="./ui/main.mjs"></script></body></html>
